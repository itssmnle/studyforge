<svg xmlns="http://www.w3.org/2000/svg" width="948" height="632" viewBox="0 0 948 632" role="img" aria-labelledby="title desc">
  <title id="title">StudyForge social preview</title>
  <desc id="desc">Editable StudyForge preview showing a Cell Biology revision workspace for KS3 students.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b27b5"/>
      <stop offset="1" stop-color="#8450db"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#f4f1fc"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#28105d" flood-opacity=".28"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="948" height="632" fill="url(#background)"/>
  <circle cx="775" cy="112" r="29" fill="#b99aff" opacity=".78"/>
  <circle cx="775" cy="112" r="29" fill="#d6c3ff" opacity=".18" filter="url(#softShadow)"/>
  <path d="M725 168C824 154 905 185 1004 272" fill="none" stroke="#d8c9ff" stroke-width="1.4" opacity=".42"/>
  <path d="M400 520C423 574 440 620 455 680" fill="none" stroke="#d8c9ff" stroke-width="1.2" opacity=".25"/>

  <!-- Logo -->
  <g id="logo" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="43" y="104" font-size="72" letter-spacing="-5">studyf</text>
    <path d="M249 58l8 18 18 8-18 8-8 18-8-18-18-8 18-8z"/>
    <text x="280" y="104" font-size="72" letter-spacing="-5">rge</text>
  </g>
  <text x="785" y="90" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.2">KS3 STUDENTS</text>

  <!-- Editable browser panel -->
  <g id="workspace" transform="rotate(-3 474 354)" filter="url(#panelShadow)">
    <rect x="121" y="155" width="696" height="400" rx="23" fill="url(#panel)"/>
    <rect x="121" y="155" width="696" height="55" rx="23" fill="#fbfaff"/>
    <rect x="121" y="188" width="696" height="22" fill="#fbfaff"/>
    <line x1="121" y1="210" x2="817" y2="210" stroke="#e5dcf7" stroke-width="2"/>
    <circle cx="146" cy="183" r="5" fill="#9779d5"/>
    <circle cx="164" cy="183" r="5" fill="#9779d5"/>
    <circle cx="182" cy="183" r="5" fill="#9779d5"/>
    <text x="216" y="188" fill="#8b7e9e" font-family="Arial, Helvetica, sans-serif" font-size="14">your revision space</text>

    <text x="151" y="258" fill="#5f26c1" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">KS3 BIOLOGY</text>
    <text x="151" y="306" fill="#17142c" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">Cell Biology</text>

    <rect x="151" y="338" width="636" height="10" rx="5" fill="#e3dbf4"/>
    <rect x="151" y="338" width="307" height="10" rx="5" fill="#7137ce"/>

    <g id="topic-rows">
      <rect x="151" y="367" width="636" height="51" rx="13" fill="#f0edf9"/>
      <circle cx="181" cy="392" r="13" fill="#7338cf"/>
      <path d="M175 392l4 4 8-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="211" y="398" fill="#433b55" font-family="Arial, Helvetica, sans-serif" font-size="14">Cell structure</text>
      <text x="721" y="398" fill="#786d8e" font-family="Arial, Helvetica, sans-serif" font-size="13">Mastered</text>

      <rect x="151" y="426" width="636" height="51" rx="13" fill="#f0edf9"/>
      <circle cx="181" cy="451" r="13" fill="#7338cf"/>
      <text x="176" y="456" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">2</text>
      <text x="211" y="457" fill="#433b55" font-family="Arial, Helvetica, sans-serif" font-size="14">Cell division</text>
      <text x="697" y="457" fill="#786d8e" font-family="Arial, Helvetica, sans-serif" font-size="13">Ready to learn</text>

      <rect x="151" y="485" width="636" height="51" rx="13" fill="#f0edf9"/>
      <circle cx="181" cy="510" r="13" fill="#7338cf"/>
      <text x="176" y="515" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">3</text>
      <text x="211" y="516" fill="#433b55" font-family="Arial, Helvetica, sans-serif" font-size="14">Transport in cells</text>
      <text x="739" y="516" fill="#786d8e" font-family="Arial, Helvetica, sans-serif" font-size="13">Up next</text>
    </g>
  </g>

  <text x="44" y="586" fill="#d5c4ff" opacity=".65" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">studyforge.web.app</text>
</svg>
