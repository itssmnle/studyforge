<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; src: url('assets/PlusJakartaSans-VariableFont_wght.ttf'); font-weight: 200 800; }
      text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7042C5"/><stop offset="0.55" stop-color="#4277DC"/><stop offset="1" stop-color="#3EB7C4"/></linearGradient>
    <radialGradient id="softViolet" cx="0.2" cy="0.1" r="1"><stop offset="0" stop-color="#F1EDFF"/><stop offset="1" stop-color="#FFFFFF"/></radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#261248" flood-opacity="0.10"/></filter>
    
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="96" y="76" fill="#1F212A" font-size="17" font-weight="800" letter-spacing="3">STUDYFORGE</text><text x="96" y="111" fill="#696C7A" font-size="14" font-weight="700" letter-spacing="2">LAYOUT AND DIGITAL COMPOSITION</text><text x="1822" y="88" fill="#696C7A" font-size="18" font-weight="700" text-anchor="end">10</text><line x1="96" y1="138" x2="1824" y2="138" stroke="#E8E8ED" stroke-width="2"/>
  
    <text x="96" y="224" fill="#1F212A" font-size="48" font-weight="760">A calm route through content</text>
    <text x="96" y="274" fill="#696C7A" font-size="23" font-weight="450"><tspan x="96" dy="0">Build from a visible grid, strong alignment, and one clear focal point. Let spacing carry</tspan><tspan x="96" dy="33">hierarchy before adding colour.</tspan></text>
    <rect x="96" y="350" width="1120" height="574" fill="#F5F5F7" rx="26" stroke="#E8E8ED" stroke-width="2"/>
    <rect x="140" y="394" width="1032" height="486" fill="#FFFFFF" rx="18" stroke="#D1D2DA" stroke-width="2"/>
    <rect x="140" y="394" width="1032" height="64" fill="#FFFFFF" rx="18"/>
    <image href="assets/logo-light.svg" x="166" y="412" width="170" height="36" preserveAspectRatio="xMidYMid meet"/>
    <line x1="140" y1="458" x2="1172" y2="458" stroke="#E8E8ED" stroke-width="2"/>
    <rect x="176" y="497" width="206" height="348" fill="#F5F5F7" rx="14"/>
    <rect x="414" y="497" width="722" height="112" fill="#F1EDFF" rx="16" stroke="#DED4FF" stroke-width="2"/>
    <text x="448" y="545" fill="#1F212A" font-size="28" font-weight="760">One clear page title</text>
    <text x="448" y="580" fill="#696C7A" font-size="17" font-weight="500">Context, current state, and next action</text>
    <rect x="414" y="637" width="344" height="208" fill="#FFFFFF" rx="16" stroke="#E8E8ED" stroke-width="2"/>
    <rect x="792" y="637" width="344" height="208" fill="#FFFFFF" rx="16" stroke="#E8E8ED" stroke-width="2"/>
    <text x="1256" y="351" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">LAYOUT RULES</text>
    <rect x="1256" y="405" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1281" y="418" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1281" dy="0">Use an 8 px base spacing unit.</tspan></text>
    <rect x="1256" y="463" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1281" y="476" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1281" dy="0">Desktop content width: 1120 to 1280 px.</tspan></text>
    <rect x="1256" y="535" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1281" y="548" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1281" dy="0">Keep headings aligned to their content</tspan><tspan x="1281" dy="30">edge.</tspan></text>
    <rect x="1256" y="607" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1281" y="620" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1281" dy="0">Limit each section to one primary action.</tspan></text>
    <rect x="1256" y="679" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1281" y="692" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1281" dy="0">On mobile, stack before shrinking text.</tspan></text>
    <rect x="1256" y="751" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1281" y="764" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1281" dy="0">Keep persistent navigation state when it</tspan><tspan x="1281" dy="30">helps orientation.</tspan></text>
    <text x="1256" y="862" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">DENSITY CHECK</text>
    <text x="1256" y="909" fill="#1F212A" font-size="20" font-weight="700">Can a student find the next action</text>
    <text x="1256" y="938" fill="#1F212A" font-size="20" font-weight="700">within three seconds?</text>
  
  <line x1="96" y1="1005" x2="1824" y2="1005" stroke="#E8E8ED" stroke-width="2"/><text x="96" y="1044" fill="#9A9CA8" font-size="15" font-weight="550">StudyForge brand guidelines</text><text x="1824" y="1044" fill="#9A9CA8" font-size="15" font-weight="550" text-anchor="end">Version 1.0 · October 2026</text>
</svg>