<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; src: url('assets/PlusJakartaSans-VariableFont_wght.ttf'); font-weight: 200 800; }
      text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7042C5"/><stop offset="0.55" stop-color="#4277DC"/><stop offset="1" stop-color="#3EB7C4"/></linearGradient>
    <radialGradient id="softViolet" cx="0.2" cy="0.1" r="1"><stop offset="0" stop-color="#F1EDFF"/><stop offset="1" stop-color="#FFFFFF"/></radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#261248" flood-opacity="0.10"/></filter>
    
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="96" y="76" fill="#1F212A" font-size="17" font-weight="800" letter-spacing="3">STUDYFORGE</text><text x="96" y="111" fill="#696C7A" font-size="14" font-weight="700" letter-spacing="2">ILLUSTRATION SYSTEM</text><text x="1822" y="88" fill="#696C7A" font-size="18" font-weight="700" text-anchor="end">08</text><line x1="96" y1="138" x2="1824" y2="138" stroke="#E8E8ED" stroke-width="2"/>
  
    <text x="96" y="224" fill="#1F212A" font-size="48" font-weight="760">The learner is the hero</text>
    <text x="96" y="274" fill="#696C7A" font-size="23" font-weight="450"><tspan x="96" dy="0">The mascot language adds warmth without turning StudyForge into a toy. Use it to</tspan><tspan x="96" dy="33">explain, reassure, and mark progress.</tspan></text>
    <rect x="96" y="348" width="816" height="580" fill="#F5F5F7" rx="28" stroke="#E8E8ED" stroke-width="2"/>
    <svg x="130" y="388" width="746" height="460" viewBox="350 155 760 520" preserveAspectRatio="xMidYMid meet"><image href="assets/assets.svg" x="0" y="0" width="1536" height="1024"/></svg>
    <rect x="130" y="853" width="292" height="42" fill="#FFFFFF" rx="21"/><text x="149" y="882" fill="#7042C5" font-size="15" font-weight="750" letter-spacing="1.8">ORIGINAL ILLUSTRATION LIBRARY</text>
    <text x="980" y="350" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">VISUAL RULES</text>
    <rect x="980" y="401" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1005" y="414" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1005" dy="0">Black or near-black hand-drawn outlines.</tspan></text>
    <rect x="980" y="467" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1005" y="480" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1005" dy="0">White characters with violet objects and accents.</tspan></text>
    <rect x="980" y="533" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1005" y="546" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1005" dy="0">Simple faces, rounded silhouettes, clear action.</tspan></text>
    <rect x="980" y="599" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1005" y="612" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1005" dy="0">Generous white space around every character.</tspan></text>
    <text x="980" y="708" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">USE FOR</text>
    <rect x="980" y="746" width="148" height="42" fill="#F1EDFF" rx="21"/><text x="999" y="775" fill="#7042C5" font-size="15" font-weight="750" letter-spacing="1.8">EMPTY STATES</text>
    <rect x="1144" y="746" width="142" height="42" fill="#EDF3FF" rx="21"/><text x="1163" y="775" fill="#4277DC" font-size="15" font-weight="750" letter-spacing="1.8">ONBOARDING</text>
    <rect x="1302" y="746" width="138" height="42" fill="#E6F8FA" rx="21"/><text x="1321" y="775" fill="#3EB7C4" font-size="15" font-weight="750" letter-spacing="1.8">MILESTONES</text>
    <rect x="1456" y="746" width="136" height="42" fill="#F5F5F7" rx="21"/><text x="1475" y="775" fill="#1F212A" font-size="15" font-weight="750" letter-spacing="1.8">CAMPAIGNS</text>
    <text x="980" y="838" fill="#D95656" font-size="16" font-weight="800" letter-spacing="2">AVOID</text>
    <text x="980" y="881" fill="#696C7A" font-size="20" font-weight="450"><tspan x="980" dy="0">Do not recolour characters, add realistic textures, use</tspan><tspan x="980" dy="28">unrelated clip art, or crowd learning content with decorative</tspan><tspan x="980" dy="28">scenes.</tspan></text>
  
  <line x1="96" y1="1005" x2="1824" y2="1005" stroke="#E8E8ED" stroke-width="2"/><text x="96" y="1044" fill="#9A9CA8" font-size="15" font-weight="550">StudyForge brand guidelines</text><text x="1824" y="1044" fill="#9A9CA8" font-size="15" font-weight="550" text-anchor="end">Version 1.0 · October 2026</text>
</svg>