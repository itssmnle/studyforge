<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; src: url('assets/PlusJakartaSans-VariableFont_wght.ttf'); font-weight: 200 800; }
      text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7042C5"/><stop offset="0.55" stop-color="#4277DC"/><stop offset="1" stop-color="#3EB7C4"/></linearGradient>
    <radialGradient id="softViolet" cx="0.2" cy="0.1" r="1"><stop offset="0" stop-color="#F1EDFF"/><stop offset="1" stop-color="#FFFFFF"/></radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#261248" flood-opacity="0.10"/></filter>
    
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="96" y="76" fill="#1F212A" font-size="17" font-weight="800" letter-spacing="3">STUDYFORGE</text><text x="96" y="111" fill="#696C7A" font-size="14" font-weight="700" letter-spacing="2">BRAND CORE</text><text x="1822" y="88" fill="#696C7A" font-size="18" font-weight="700" text-anchor="end">02</text><line x1="96" y1="138" x2="1824" y2="138" stroke="#E8E8ED" stroke-width="2"/>
  
    <rect x="96" y="178" width="129" height="42" fill="#F1EDFF" rx="21"/><text x="115" y="207" fill="#7042C5" font-size="15" font-weight="750" letter-spacing="1.8">PURPOSE</text>
    <text x="96" y="265" fill="#1F212A" font-size="54" font-weight="760"><tspan x="96" dy="0">Make revision easier to navigate,</tspan><tspan x="96" dy="64">not noisier to use.</tspan></text>
    <text x="96" y="430" fill="#696C7A" font-size="25" font-weight="450"><tspan x="96" dy="0">StudyForge connects explanation, recall, practice, and progress</tspan><tspan x="96" dy="38">into one calm route. It should help students understand what to do</tspan><tspan x="96" dy="38">now and what comes next.</tspan></text>
    <rect x="96" y="625" width="528" height="270" fill="#F1EDFF" rx="22" stroke="#DED4FF" stroke-width="2"/>
    <text x="132" y="681" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">CLEAR BY DESIGN</text>
    <text x="132" y="739" fill="#1F212A" font-size="30" font-weight="740">Reduce cognitive friction</text>
    <text x="132" y="790" fill="#696C7A" font-size="20" font-weight="450"><tspan x="132" dy="0">Use visible hierarchy, plain language,</tspan><tspan x="132" dy="28">and focused choices. Decoration never</tspan><tspan x="132" dy="28">competes with learning.</tspan></text>
    <rect x="648" y="625" width="528" height="270" fill="#EDF3FF" rx="22" stroke="#B9D0FF" stroke-width="2"/>
    <text x="684" y="681" fill="#4277DC" font-size="16" font-weight="800" letter-spacing="2">CONNECTED BY DEFAULT</text>
    <text x="684" y="739" fill="#1F212A" font-size="30" font-weight="740">One learning route</text>
    <text x="684" y="790" fill="#696C7A" font-size="20" font-weight="450"><tspan x="684" dy="0">Notes, flashcards, questions, and</tspan><tspan x="684" dy="28">homework should feel like stages of the</tspan><tspan x="684" dy="28">same experience.</tspan></text>
    <rect x="1200" y="625" width="624" height="270" fill="#E6F8FA" rx="22" stroke="#B9E9ED" stroke-width="2"/>
    <text x="1236" y="681" fill="#3EB7C4" font-size="16" font-weight="800" letter-spacing="2">PRIVATE WHERE IT MATTERS</text>
    <text x="1236" y="739" fill="#1F212A" font-size="30" font-weight="740">Confidence without surveillance</text>
    <text x="1236" y="790" fill="#696C7A" font-size="20" font-weight="450"><tspan x="1236" dy="0">Assigned work can be visible to teachers.</tspan><tspan x="1236" dy="28">Independent revision remains the student's own</tspan><tspan x="1236" dy="28">space.</tspan></text>
  
  <line x1="96" y1="1005" x2="1824" y2="1005" stroke="#E8E8ED" stroke-width="2"/><text x="96" y="1044" fill="#9A9CA8" font-size="15" font-weight="550">StudyForge brand guidelines</text><text x="1824" y="1044" fill="#9A9CA8" font-size="15" font-weight="550" text-anchor="end">Version 1.0 · October 2026</text>
</svg>