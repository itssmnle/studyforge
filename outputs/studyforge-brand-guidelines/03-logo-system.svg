<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; src: url('assets/PlusJakartaSans-VariableFont_wght.ttf'); font-weight: 200 800; }
      text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7042C5"/><stop offset="0.55" stop-color="#4277DC"/><stop offset="1" stop-color="#3EB7C4"/></linearGradient>
    <radialGradient id="softViolet" cx="0.2" cy="0.1" r="1"><stop offset="0" stop-color="#F1EDFF"/><stop offset="1" stop-color="#FFFFFF"/></radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#261248" flood-opacity="0.10"/></filter>
    
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="96" y="76" fill="#1F212A" font-size="17" font-weight="800" letter-spacing="3">STUDYFORGE</text><text x="96" y="111" fill="#696C7A" font-size="14" font-weight="700" letter-spacing="2">LOGO SYSTEM</text><text x="1822" y="88" fill="#696C7A" font-size="18" font-weight="700" text-anchor="end">03</text><line x1="96" y1="138" x2="1824" y2="138" stroke="#E8E8ED" stroke-width="2"/>
  
    <text x="96" y="230" fill="#1F212A" font-size="48" font-weight="760">The primary signature</text>
    <text x="96" y="280" fill="#696C7A" font-size="23" font-weight="450"><tspan x="96" dy="0">Use the full wordmark wherever the available width supports clear</tspan><tspan x="96" dy="33">recognition.</tspan></text>
    <rect x="96" y="365" width="1070" height="280" fill="#F5F5F7" rx="28" stroke="#E8E8ED" stroke-width="2"/>
    <image href="assets/logo-light.svg" x="175" y="445" width="900" height="125" preserveAspectRatio="xMidYMid meet"/>
    <text x="1250" y="365" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">PRIMARY USE</text>
    <rect x="1250" y="414" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1275" y="427" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1275" dy="0">Dark wordmark on white or quiet light</tspan><tspan x="1275" dy="30">surfaces.</tspan></text>
    <rect x="1250" y="491" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1275" y="504" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1275" dy="0">Keep the violet spark in its approved</tspan><tspan x="1275" dy="30">colour.</tspan></text>
    <rect x="1250" y="568" width="9" height="9" fill="#7042C5" rx="4.5"/><text x="1275" y="581" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1275" dy="0">Prefer the complete signature over</tspan><tspan x="1275" dy="30">cropped text.</tspan></text>
    <rect x="96" y="695" width="790" height="224" fill="#111226" rx="28" stroke="#363958" stroke-width="2"/>
    <image href="assets/logo-dark.svg" x="165" y="753" width="650" height="106" preserveAspectRatio="xMidYMid meet"/>
    <text x="934" y="737" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">REVERSE SIGNATURE</text>
    <text x="934" y="783" fill="#696C7A" font-size="22" font-weight="450"><tspan x="934" dy="0">Use the light wordmark on dark navy or photography</tspan><tspan x="934" dy="31">with strong, even contrast.</tspan></text>
    <text x="934" y="876" fill="#1F212A" font-size="19" font-weight="700">Never rebuild the letters as live type.</text>
  
  <line x1="96" y1="1005" x2="1824" y2="1005" stroke="#E8E8ED" stroke-width="2"/><text x="96" y="1044" fill="#9A9CA8" font-size="15" font-weight="550">StudyForge brand guidelines</text><text x="1824" y="1044" fill="#9A9CA8" font-size="15" font-weight="550" text-anchor="end">Version 1.0 · October 2026</text>
</svg>