  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="96" y="76" fill="#1F212A" font-size="17" font-weight="800" letter-spacing="3">STUDYFORGE</text><text x="96" y="111" fill="#696C7A" font-size="14" font-weight="700" letter-spacing="2">TYPOGRAPHY</text><text x="1822" y="88" fill="#696C7A" font-size="18" font-weight="700" text-anchor="end">07</text><line x1="96" y1="138" x2="1824" y2="138" stroke="#E8E8ED" stroke-width="2"/>
  
    <text x="96" y="224" fill="#1F212A" font-size="50" font-weight="760">Plus Jakarta Sans</text>
    <text x="96" y="278" fill="#696C7A" font-size="23" font-weight="450"><tspan x="96" dy="0">The single brand family. Its open forms support dense educational content</tspan><tspan x="96" dy="33">without making the interface feel clinical.</tspan></text>
    <rect x="96" y="352" width="1030" height="546" fill="#F5F5F7" rx="26" stroke="#E8E8ED" stroke-width="2"/>
    <text x="144" y="440" fill="#1F212A" font-size="96" font-weight="760">Aa</text>
    <text x="325" y="425" fill="#1F212A" font-size="25" font-weight="650" letter-spacing="1.4">ABCDEFGHIJKLMNOPQRSTUVWXYZ</text>
    <text x="325" y="470" fill="#1F212A" font-size="25" font-weight="500" letter-spacing="1.2">abcdefghijklmnopqrstuvwxyz</text>
    <text x="325" y="515" fill="#1F212A" font-size="25" font-weight="500">0123456789  + − × ÷ =  ( )  ? !</text>
    <line x1="144" y1="574" x2="1078" y2="574" stroke="#D1D2DA" stroke-width="2"/>
    <text x="144" y="632" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">Display</text>
    <text x="144" y="693" fill="#1F212A" font-size="38" font-weight="760">Revision that knows what comes next.</text>
    <text x="144" y="760" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">Body</text>
    <text x="144" y="811" fill="#696C7A" font-size="21" font-weight="450"><tspan x="144" dy="0">Write for quick comprehension. Use real sentence case, familiar</tspan><tspan x="144" dy="30">words, and enough space to scan.</tspan></text>
    <text x="1198" y="352" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">TYPE SCALE</text>
    <text x="1198" y="415" fill="#1F212A" font-size="46" font-weight="760">72 / 76</text><text x="1460" y="415" fill="#696C7A" font-size="19" font-weight="650">Hero</text>
    <line x1="1198" y1="449" x2="1824" y2="449" stroke="#E8E8ED" stroke-width="2"/>
    <text x="1198" y="506" fill="#1F212A" font-size="38" font-weight="760">48 / 56</text><text x="1460" y="506" fill="#696C7A" font-size="19" font-weight="650">Page title</text>
    <line x1="1198" y1="540" x2="1824" y2="540" stroke="#E8E8ED" stroke-width="2"/>
    <text x="1198" y="597" fill="#1F212A" font-size="30" font-weight="740">32 / 40</text><text x="1460" y="597" fill="#696C7A" font-size="19" font-weight="650">Section title</text>
    <line x1="1198" y1="631" x2="1824" y2="631" stroke="#E8E8ED" stroke-width="2"/>
    <text x="1198" y="688" fill="#1F212A" font-size="24" font-weight="650">24 / 34</text><text x="1460" y="688" fill="#696C7A" font-size="19" font-weight="650">Intro copy</text>
    <line x1="1198" y1="722" x2="1824" y2="722" stroke="#E8E8ED" stroke-width="2"/>
    <text x="1198" y="779" fill="#1F212A" font-size="18" font-weight="550">18 / 28</text><text x="1460" y="779" fill="#696C7A" font-size="19" font-weight="650">Body copy</text>
    <line x1="1198" y1="813" x2="1824" y2="813" stroke="#E8E8ED" stroke-width="2"/>
    <text x="1198" y="870" fill="#1F212A" font-size="14" font-weight="650">14 / 20</text><text x="1460" y="870" fill="#696C7A" font-size="19" font-weight="650">Label and metadata</text>
    <text x="1198" y="934" fill="#696C7A" font-size="18" font-weight="550">Use 450 to 550 for body, 700 to 800 for display.</text>
  
  <line x1="96" y1="1005" x2="1824" y2="1005" stroke="#E8E8ED" stroke-width="2"/><text x="96" y="1044" fill="#9A9CA8" font-size="15" font-weight="550">StudyForge brand guidelines</text><text x="1824" y="1044" fill="#9A9CA8" font-size="15" font-weight="550" text-anchor="end">Version 1.0 · October 2026</text>
