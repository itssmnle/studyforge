<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; src: url('assets/PlusJakartaSans-VariableFont_wght.ttf'); font-weight: 200 800; }
      text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7042C5"/><stop offset="0.55" stop-color="#4277DC"/><stop offset="1" stop-color="#3EB7C4"/></linearGradient>
    <radialGradient id="softViolet" cx="0.2" cy="0.1" r="1"><stop offset="0" stop-color="#F1EDFF"/><stop offset="1" stop-color="#FFFFFF"/></radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#261248" flood-opacity="0.10"/></filter>
    
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="96" y="76" fill="#1F212A" font-size="17" font-weight="800" letter-spacing="3">STUDYFORGE</text><text x="96" y="111" fill="#696C7A" font-size="14" font-weight="700" letter-spacing="2">LOGO PROTECTION</text><text x="1822" y="88" fill="#696C7A" font-size="18" font-weight="700" text-anchor="end">04</text><line x1="96" y1="138" x2="1824" y2="138" stroke="#E8E8ED" stroke-width="2"/>
  
    <text x="96" y="224" fill="#1F212A" font-size="48" font-weight="760">Protect recognition</text>
    <text x="96" y="274" fill="#696C7A" font-size="23" font-weight="450"><tspan x="96" dy="0">Spacing and scale rules keep the signature legible across product, print,</tspan><tspan x="96" dy="33">and social use.</tspan></text>
    <text x="96" y="358" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">CLEAR SPACE</text>
    <rect x="96" y="398" width="928" height="270" fill="#F5F5F7" rx="20" stroke="#E8E8ED" stroke-width="2"/>
    <rect x="166" y="438" width="788" height="190" fill="none" stroke="#7042C5" stroke-width="2" stroke-dasharray="12 10" rx="12"/>
    <image href="assets/logo-light.svg" x="250" y="487" width="620" height="94" preserveAspectRatio="xMidYMid meet"/>
    <text x="126" y="536" fill="#7042C5" font-size="22" font-weight="750">x</text>
    <text x="900" y="536" fill="#7042C5" font-size="22" font-weight="750">x</text>
    <text x="96" y="715" fill="#696C7A" font-size="21" font-weight="450"><tspan x="96" dy="0">Keep at least one spark-width of clear space on every side.</tspan><tspan x="96" dy="30">Treat this as the minimum, not the target.</tspan></text>
    <text x="1110" y="358" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">MINIMUM SIZE</text>
    <rect x="1110" y="398" width="714" height="270" fill="#FFFFFF" rx="20" stroke="#E8E8ED" stroke-width="2"/>
    <image href="assets/logo-light.svg" x="1165" y="455" width="520" height="84" preserveAspectRatio="xMidYMid meet"/>
    <line x1="1165" y1="575" x2="1685" y2="575" stroke="#7042C5" stroke-width="3"/>
    <text x="1425" y="610" fill="#696C7A" font-size="18" font-weight="650" text-anchor="middle">160 px digital · 42 mm print</text>
    <text x="1110" y="733" fill="#D95656" font-size="16" font-weight="800" letter-spacing="2">DO NOT</text>
    <rect x="1110" y="778" width="9" height="9" fill="#D95656" rx="4.5"/><text x="1135" y="791" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1135" dy="0">Stretch, condense, rotate, or rearrange the</tspan><tspan x="1135" dy="30">signature.</tspan></text>
    <rect x="1110" y="841" width="9" height="9" fill="#D95656" rx="4.5"/><text x="1135" y="854" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1135" dy="0">Apply gradients, shadows, outlines, or</tspan><tspan x="1135" dy="30">unapproved colours.</tspan></text>
    <rect x="1110" y="904" width="9" height="9" fill="#D95656" rx="4.5"/><text x="1135" y="917" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1135" dy="0">Place it on busy imagery without a quiet</tspan><tspan x="1135" dy="30">contrast field.</tspan></text>
  
  <line x1="96" y1="1005" x2="1824" y2="1005" stroke="#E8E8ED" stroke-width="2"/><text x="96" y="1044" fill="#9A9CA8" font-size="15" font-weight="550">StudyForge brand guidelines</text><text x="1824" y="1044" fill="#9A9CA8" font-size="15" font-weight="550" text-anchor="end">Version 1.0 · October 2026</text>
</svg>