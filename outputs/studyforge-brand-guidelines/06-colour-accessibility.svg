  <defs>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; src: url('assets/PlusJakartaSans-VariableFont_wght.ttf'); font-weight: 200 800; }
      text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    </style>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7042C5"/><stop offset="0.55" stop-color="#4277DC"/><stop offset="1" stop-color="#3EB7C4"/></linearGradient>
    <radialGradient id="softViolet" cx="0.2" cy="0.1" r="1"><stop offset="0" stop-color="#F1EDFF"/><stop offset="1" stop-color="#FFFFFF"/></radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#261248" flood-opacity="0.10"/></filter>
    
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <text x="96" y="76" fill="#1F212A" font-size="17" font-weight="800" letter-spacing="3">STUDYFORGE</text><text x="96" y="111" fill="#696C7A" font-size="14" font-weight="700" letter-spacing="2">COLOUR AND ACCESSIBILITY</text><text x="1822" y="88" fill="#696C7A" font-size="18" font-weight="700" text-anchor="end">06</text><line x1="96" y1="138" x2="1824" y2="138" stroke="#E8E8ED" stroke-width="2"/>
  
    <text x="96" y="224" fill="#1F212A" font-size="48" font-weight="760">Contrast before decoration</text>
    <text x="96" y="274" fill="#696C7A" font-size="23" font-weight="450"><tspan x="96" dy="0">Use approved pairs for readable text. Gradients belong on large atmospheric fields, not</tspan><tspan x="96" dy="33">body copy or essential controls.</tspan></text>
    <text x="96" y="355" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">APPROVED TEXT PAIRS</text>
    <rect x="96" y="395" width="526" height="194" fill="#FFFFFF" rx="22" stroke="#E8E8ED" stroke-width="2"/>
    <text x="128" y="449" fill="#1F212A" font-size="30" font-weight="760">Ink on white</text>
    <text x="128" y="492" fill="#696C7A" font-size="19" font-weight="450"><tspan x="128" dy="0">Primary body and heading pair</tspan></text>
    <rect x="128" y="531" width="135" height="42" fill="#F1EDFF" rx="21"/><text x="147" y="560" fill="#7042C5" font-size="15" font-weight="750" letter-spacing="1.8">PREFERRED</text>
    <rect x="646" y="395" width="526" height="194" fill="#261248" rx="22" stroke="#261248" stroke-width="2"/>
    <text x="678" y="449" fill="#FFFFFF" font-size="30" font-weight="760">White on deep violet</text>
    <text x="678" y="492" fill="#DED4FF" font-size="19" font-weight="450"><tspan x="678" dy="0">Hero and campaign moments</tspan></text>
    <rect x="678" y="531" width="135" height="42" fill="#FFFFFF1A" rx="21"/><text x="697" y="560" fill="#FFFFFF" font-size="15" font-weight="750" letter-spacing="1.8">APPROVED</text>
    <rect x="1196" y="395" width="628" height="194" fill="#111226" rx="22" stroke="#363958" stroke-width="2"/>
    <text x="1228" y="449" fill="#F7F7FF" font-size="30" font-weight="760">Light text on dark navy</text>
    <text x="1228" y="492" fill="#B5B9D0" font-size="19" font-weight="450"><tspan x="1228" dy="0">Dark mode primary pair</tspan></text>
    <rect x="1228" y="531" width="135" height="42" fill="#FFFFFF12" rx="21"/><text x="1247" y="560" fill="#F7F7FF" font-size="15" font-weight="750" letter-spacing="1.8">APPROVED</text>
    <text x="96" y="670" fill="#7042C5" font-size="16" font-weight="800" letter-spacing="2">GRADIENT RULE</text>
    <rect x="96" y="712" width="1076" height="206" fill="url(#brandGradient)" rx="24"/>
    <text x="140" y="786" fill="#FFFFFF" font-size="34" font-weight="760">Use as atmosphere, not information.</text>
    <text x="140" y="836" fill="#FFFFFF" font-size="20" font-weight="450"><tspan x="140" dy="0">Keep opacity low on light pages. Give text a clear solid field</tspan><tspan x="140" dy="28">when readability is at risk.</tspan></text>
    <rect x="1212" y="712" width="612" height="206" fill="#F5F5F7" rx="24" stroke="#E8E8ED" stroke-width="2"/>
    <text x="1248" y="766" fill="#D95656" font-size="16" font-weight="800" letter-spacing="2">AVOID</text>
    <rect x="1248" y="809" width="9" height="9" fill="#D95656" rx="4.5"/><text x="1273" y="822" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1273" dy="0">Gradient body text or tiny labels.</tspan></text>
    <rect x="1248" y="860" width="9" height="9" fill="#D95656" rx="4.5"/><text x="1273" y="873" fill="#696C7A" font-size="22" font-weight="450"><tspan x="1273" dy="0">Colour alone to signal status.</tspan></text>
  
  <line x1="96" y1="1005" x2="1824" y2="1005" stroke="#E8E8ED" stroke-width="2"/><text x="96" y="1044" fill="#9A9CA8" font-size="15" font-weight="550">StudyForge brand guidelines</text><text x="1824" y="1044" fill="#9A9CA8" font-size="15" font-weight="550" text-anchor="end">Version 1.0 · October 2026</text>
