<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 360" role="img" aria-labelledby="title desc">
<title id="title">Net of a cuboid</title>
<desc id="desc">Six rectangular faces of a two by three by four centimetre cuboid laid flat, with matching pairs shaded alike.</desc>
<rect width="550" height="360" fill="#fff"/>
<g stroke="#6356c8" stroke-width="3">
<rect x="100" y="145" width="50" height="100" fill="#eaf6ef"/>
<rect x="150" y="145" width="75" height="100" fill="#f3efff"/>
<rect x="225" y="145" width="50" height="100" fill="#eaf6ef"/>
<rect x="275" y="145" width="75" height="100" fill="#f3efff"/>
<rect x="150" y="95" width="75" height="50" fill="#fff1df"/>
<rect x="150" y="245" width="75" height="50" fill="#fff1df"/>
</g>
<g fill="#252936" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">
<text x="125" y="198" font-size="13">2 × 4</text><text x="187" y="198">3 × 4</text>
<text x="250" y="198" font-size="13">2 × 4</text><text x="312" y="198">3 × 4</text>
<text x="187" y="126">2 × 3</text><text x="187" y="276">2 × 3</text>
<text x="275" y="343">Matching colours are opposite face pairs</text>
</g>
</svg>
