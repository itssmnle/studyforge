   Author: Yves Baelde

   Aspect ratio  1/1 = 1188/1188


 Autre version sans élément 'use',
 avec des entités déclarées en DTD,
 et contenant le commentaire principal :
ENT_Homothetic_rectangles.svg



 Élément  g id="rct".

 Même en supprimant les balises de la section 'defs', le petit
 rectangle de dimensions  20  sur  32  (20/32 = 5/8)  produit
 par l'élément  g #rct  serait invisible, l'arrière-plan blanc
 et le cadre jaune  #ef7  le cacheraient. À cause des valeurs des
 attributs  'transform'  des deux éléments  'use',  le sommet
 '0 0'  de ce petit rectangle à rayures devient  '775 674',
 sommet commun T des deux rectangles homothétiques, à rayures.

 Donner à 'viewBox' la valeur  "-9 -3 45 45"  agrandirait
 ce petit rectangle à rayures, produit par l'élément   g id="rct"
 qui pourrait sortir de la section 'defs', et se coder après
 l'élément  path stroke="#ef7"  pour se montrer.



