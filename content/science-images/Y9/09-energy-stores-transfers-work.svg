<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Energy Stores, Transfers, and Work Done</title><desc id="desc">Energy transfer diagram showing gravitational potential energy becoming kinetic energy on a roller coaster.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><path d="M800 80 C650 250 950 250 800 820 C650 600 950 600 800 80Z" fill="#faf9fd"/><text x="800" y="78" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#201d2d" text-anchor="middle">Energy Stores, Transfers, and Work Done</text><text x="800" y="125" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#6f49c9" text-anchor="middle">A roller coaster example</text><rect x="80" y="200" width="1440" height="470" rx="28" fill="#eee8ff" stroke="#6f49c9" stroke-width="5"/><text x="800" y="255" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#6f49c9" text-anchor="middle">Gravitational potential energy</text><text x="800" y="300" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#2ba6a5" text-anchor="middle">transferred to kinetic energy</text><path d="M160 580 C300 540 350 330 520 350 C650 370 690 560 820 550 C980 540 1040 300 1190 350 C1310 390 1360 510 1460 470" fill="none" stroke="#201d2d" stroke-width="10"/><circle cx="520" cy="350" r="17" fill="#f45b69" stroke="none" stroke-width="0"/><circle cx="1190" cy="350" r="17" fill="#f45b69" stroke="none" stroke-width="0"/><text x="520" y="320" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#6f49c9" text-anchor="middle">high GPE</text><text x="1190" y="320" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#6f49c9" text-anchor="middle">high GPE</text><circle cx="820" cy="550" r="17" fill="#2ba6a5" stroke="none" stroke-width="0"/><text x="820" y="610" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#2ba6a5" text-anchor="middle">high KE</text><text x="800" y="735" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#2ba6a5" text-anchor="middle">Eₖ = ½mv²</text><text x="1080" y="735" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#6f49c9" text-anchor="middle">ΔEₚ = mgh</text><text x="1280" y="735" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#e8ad00" text-anchor="middle">W = F × d</text><text x="800" y="850" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#6f49c9" text-anchor="middle">Energy is transferred between stores, not created or destroyed.</text></svg>