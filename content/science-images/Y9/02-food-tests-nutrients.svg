<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Food Tests and Nutrients</title><desc id="desc">Food test colour results for starch, glucose, protein, and lipids.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><path d="M800 80 C650 250 950 250 800 820 C650 600 950 600 800 80Z" fill="#faf9fd"/><text x="800" y="78" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#201d2d" text-anchor="middle">Food Tests and Nutrients</text><text x="800" y="125" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#6f49c9" text-anchor="middle">Positive and negative results</text><text x="800" y="185" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#201d2d" text-anchor="middle">Add the reagent, observe the colour, identify the nutrient</text><rect x="65" y="235" width="340" height="490" rx="26" fill="#fff" stroke="#6f49c9" stroke-width="5"/><text x="235" y="290" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#6f49c9" text-anchor="middle">Starch</text><text x="235" y="335" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#201d2d" text-anchor="middle">Iodine</text><rect x="120" y="390" width="230" height="120" rx="12" fill="#fff" stroke="#201d2d" stroke-width="4"/><rect x="120" y="390" width="230" height="120" rx="12" fill="#15152a" stroke="none" stroke-width="0"/><text x="235" y="570" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#201d2d" text-anchor="middle">blue-black</text><text x="235" y="630" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#6f49c9" text-anchor="middle">Positive: blue-black</text><rect x="450" y="235" width="340" height="490" rx="26" fill="#fff" stroke="#f45b69" stroke-width="5"/><text x="620" y="290" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f45b69" text-anchor="middle">Glucose</text><text x="620" y="335" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#201d2d" text-anchor="middle">Benedict’s + heat</text><rect x="505" y="390" width="230" height="120" rx="12" fill="#fff" stroke="#201d2d" stroke-width="4"/><rect x="505" y="390" width="230" height="120" rx="12" fill="#c83d4c" stroke="none" stroke-width="0"/><text x="620" y="570" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#201d2d" text-anchor="middle">brick-red</text><text x="620" y="630" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#f45b69" text-anchor="middle">Positive: brick-red</text><rect x="835" y="235" width="340" height="490" rx="26" fill="#fff" stroke="#2e83d8" stroke-width="5"/><text x="1005" y="290" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#2e83d8" text-anchor="middle">Protein</text><text x="1005" y="335" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#201d2d" text-anchor="middle">Biuret</text><rect x="890" y="390" width="230" height="120" rx="12" fill="#fff" stroke="#201d2d" stroke-width="4"/><rect x="890" y="390" width="230" height="120" rx="12" fill="#cdbdff" stroke="none" stroke-width="0"/><text x="1005" y="570" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#201d2d" text-anchor="middle">lilac</text><text x="1005" y="630" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2e83d8" text-anchor="middle">Positive: lilac</text><rect x="1220" y="235" width="340" height="490" rx="26" fill="#fff" stroke="#e8ad00" stroke-width="5"/><text x="1390" y="290" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#e8ad00" text-anchor="middle">Lipids</text><text x="1390" y="335" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#201d2d" text-anchor="middle">Sudan III</text><rect x="1275" y="390" width="230" height="120" rx="12" fill="#fff" stroke="#201d2d" stroke-width="4"/><rect x="1275" y="390" width="230" height="58" rx="0" fill="#f4e2c9" stroke="none" stroke-width="0"/><rect x="1275" y="448" width="230" height="62" rx="0" fill="#ef6a60" stroke="none" stroke-width="0"/><text x="1390" y="570" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#201d2d" text-anchor="middle">red-stained layer</text><text x="1390" y="630" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#e8ad00" text-anchor="middle">Positive: red layer</text><text x="800" y="850" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#6f49c9" text-anchor="middle">A colour change indicates the nutrient is present.</text></svg>