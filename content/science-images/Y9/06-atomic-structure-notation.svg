<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Atomic Structure and Notation</title><desc id="desc">Atomic diagram with nucleus, electrons in shells, and mass and atomic numbers.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><path d="M800 80 C650 250 950 250 800 820 C650 600 950 600 800 80Z" fill="#faf9fd"/><text x="800" y="78" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#201d2d" text-anchor="middle">Atomic Structure and Notation</text><text x="800" y="125" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#6f49c9" text-anchor="middle">Mass number A and atomic number Z</text><circle cx="480" cy="465" r="185" fill="#eee8ff" stroke="#6f49c9" stroke-width="6"/><circle cx="480" cy="465" r="75" fill="#6f49c9" stroke="none" stroke-width="0"/><text x="480" y="475" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="700" fill="#fff" text-anchor="middle">X</text><text x="480" y="235" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#6f49c9" text-anchor="middle">Nucleus</text><ellipse cx="480" cy="465" rx="110" ry="55" fill="none" stroke="#2ba6a5" stroke-width="5"/><ellipse cx="480" cy="465" rx="150" ry="75" fill="none" stroke="#2ba6a5" stroke-width="5"/><circle cx="480" cy="355" r="14" fill="#f45b69" stroke="#fff" stroke-width="4"/><circle cx="630" cy="465" r="14" fill="#f45b69" stroke="#fff" stroke-width="4"/><circle cx="480" cy="575" r="14" fill="#f45b69" stroke="#fff" stroke-width="4"/><circle cx="330" cy="465" r="14" fill="#f45b69" stroke="#fff" stroke-width="4"/><text x="780" y="300" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" fill="#f45b69" text-anchor="middle">A</text><text x="845" y="300" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#201d2d" text-anchor="middle">Mass number</text><text x="780" y="390" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" fill="#2e83d8" text-anchor="middle">Z</text><text x="845" y="390" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#201d2d" text-anchor="middle">Atomic number</text><line x1="700" y1="330" x2="1100" y2="330" stroke="#f45b69" stroke-width="3" /><line x1="700" y1="420" x2="1100" y2="420" stroke="#2e83d8" stroke-width="3" /><text x="800" y="585" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#f45b69" text-anchor="middle">A = protons + neutrons</text><text x="800" y="635" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#2e83d8" text-anchor="middle">Z = number of protons</text><text x="800" y="685" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2ba6a5" text-anchor="middle">electrons = Z in a neutral atom</text><text x="800" y="850" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#6f49c9" text-anchor="middle">The symbol X represents the element.</text></svg>