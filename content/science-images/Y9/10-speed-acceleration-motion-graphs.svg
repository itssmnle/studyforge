<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Speed, Acceleration, and Motion Graphs</title><desc id="desc">Speed-time graph showing acceleration, steady speed, deceleration, and shaded distance.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><path d="M800 80 C650 250 950 250 800 820 C650 600 950 600 800 80Z" fill="#faf9fd"/><text x="800" y="78" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#201d2d" text-anchor="middle">Speed, Acceleration, and Motion Graphs</text><text x="800" y="125" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#6f49c9" text-anchor="middle">Speed-time graph with distance shaded</text><rect x="160" y="230" width="1160" height="420" rx="18" fill="#fbfaff" stroke="#6f49c9" stroke-width="4"/><line x1="353.33333333333337" y1="230" x2="353.33333333333337" y2="650" stroke="#e4def3" stroke-width="2" /><line x1="546.6666666666667" y1="230" x2="546.6666666666667" y2="650" stroke="#e4def3" stroke-width="2" /><line x1="740" y1="230" x2="740" y2="650" stroke="#e4def3" stroke-width="2" /><line x1="933.3333333333334" y1="230" x2="933.3333333333334" y2="650" stroke="#e4def3" stroke-width="2" /><line x1="1126.6666666666665" y1="230" x2="1126.6666666666665" y2="650" stroke="#e4def3" stroke-width="2" /><line x1="160" y1="566" x2="1320" y2="566" stroke="#e4def3" stroke-width="2" /><line x1="160" y1="482" x2="1320" y2="482" stroke="#e4def3" stroke-width="2" /><line x1="160" y1="398" x2="1320" y2="398" stroke="#e4def3" stroke-width="2" /><line x1="160" y1="314" x2="1320" y2="314" stroke="#e4def3" stroke-width="2" /><line x1="160" y1="650" x2="1350" y2="650" stroke="#201d2d" stroke-width="5" /><line x1="160" y1="650" x2="160" y2="200" stroke="#201d2d" stroke-width="5" /><text x="1450" y="690" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#201d2d" text-anchor="middle">time</text><text x="115" y="225" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#201d2d" text-anchor="middle">speed</text><path d="M160 650 L390 380 L810 380 L1140 650 Z" fill="#eee8ff" stroke="none"/><line x1="160" y1="650" x2="390" y2="380" stroke="#6f49c9" stroke-width="8" /><line x1="390" y1="380" x2="810" y2="380" stroke="#2ba6a5" stroke-width="8" /><line x1="810" y1="380" x2="1140" y2="650" stroke="#f45b69" stroke-width="8" /><text x="270" y="470" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#6f49c9" text-anchor="middle">acceleration</text><text x="600" y="350" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2ba6a5" text-anchor="middle">steady speed</text><text x="975" y="470" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f45b69" text-anchor="middle">deceleration</text><text x="800" y="800" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#6f49c9" text-anchor="middle">shaded area = distance travelled</text><text x="800" y="850" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#6f49c9" text-anchor="middle">Gradient shows acceleration; area under a speed-time graph shows distance.</text></svg>