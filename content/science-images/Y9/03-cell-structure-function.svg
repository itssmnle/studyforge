<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Cell Structure and Function</title><desc id="desc">Labeled comparison of animal, plant, and bacterial cells.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><path d="M800 80 C650 250 950 250 800 820 C650 600 950 600 800 80Z" fill="#faf9fd"/><text x="800" y="78" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#201d2d" text-anchor="middle">Cell Structure and Function</text><text x="800" y="125" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#6f49c9" text-anchor="middle">Animal, plant, and bacterial cells</text><rect x="45" y="175" width="470" height="590" rx="28" fill="#eee8ff" stroke="#6f49c9" stroke-width="5"/><text x="280" y="220" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#6f49c9" text-anchor="middle">Animal cell</text><circle cx="280" cy="430" r="130" fill="#fff" stroke="#6f49c9" stroke-width="5"/><circle cx="280" cy="430" r="48" fill="#6f49c9" stroke="none" stroke-width="0"/><text x="280" y="438" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Nucleus</text><circle cx="195" cy="355" r="10" fill="#f45b69" stroke="none" stroke-width="0"/><circle cx="280" cy="355" r="10" fill="#f45b69" stroke="none" stroke-width="0"/><circle cx="365" cy="355" r="10" fill="#f45b69" stroke="none" stroke-width="0"/><circle cx="195" cy="460" r="10" fill="#f45b69" stroke="none" stroke-width="0"/><circle cx="280" cy="460" r="10" fill="#f45b69" stroke="none" stroke-width="0"/><text x="280" y="610" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Nucleus</text><text x="280" y="640" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Cytoplasm</text><text x="280" y="670" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Cell membrane</text><text x="280" y="700" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Mitochondria</text><rect x="555" y="175" width="470" height="590" rx="28" fill="#d8f3f0" stroke="#2ba6a5" stroke-width="5"/><text x="790" y="220" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#2ba6a5" text-anchor="middle">Plant cell</text><rect x="670" y="305" width="240" height="250" rx="18" fill="#b9eadf" stroke="#2ba6a5" stroke-width="8"/><rect x="710" y="345" width="160" height="170" rx="12" fill="#e8fff8" stroke="#57ad73" stroke-width="3"/><circle cx="790" cy="430" r="35" fill="#2ba6a5" stroke="none" stroke-width="0"/><rect x="685" y="320" width="35" height="65" rx="8" fill="#57ad73" stroke="none" stroke-width="0"/><rect x="790" y="320" width="35" height="65" rx="8" fill="#57ad73" stroke="none" stroke-width="0"/><rect x="685" y="510" width="35" height="65" rx="8" fill="#57ad73" stroke="none" stroke-width="0"/><rect x="790" y="510" width="35" height="65" rx="8" fill="#57ad73" stroke="none" stroke-width="0"/><text x="790" y="610" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Nucleus</text><text x="790" y="640" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Cell wall</text><text x="790" y="670" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Chloroplasts</text><text x="790" y="700" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Permanent vacuole</text><rect x="1065" y="175" width="470" height="590" rx="28" fill="#fff0b5" stroke="#e8ad00" stroke-width="5"/><text x="1300" y="220" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#e8ad00" text-anchor="middle">Bacterial cell</text><rect x="1170" y="330" width="260" height="190" rx="70" fill="#fff7cf" stroke="#e8ad00" stroke-width="7"/><path d="M160 430 C220 340 300 520 365 430" fill="none" stroke="#e8ad00" stroke-width="8"/><circle cx="1305" cy="430" r="13" fill="#f45b69" stroke="none" stroke-width="0"/><circle cx="1210" cy="395" r="9" fill="#2e83d8" stroke="none" stroke-width="0"/><text x="1300" y="610" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Cell wall</text><text x="1300" y="640" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Circular DNA</text><text x="1300" y="670" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Plasmid</text><text x="1300" y="700" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Ribosomes</text><text x="800" y="850" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#6f49c9" text-anchor="middle">Plant cells contain the animal-cell structures plus a cell wall, chloroplasts, and permanent vacuole.</text></svg>