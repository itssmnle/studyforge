<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Diffusion, Osmosis, and Active Transport</title><desc id="desc">Comparison of diffusion, osmosis, and active transport across cell membranes.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><path d="M800 80 C650 250 950 250 800 820 C650 600 950 600 800 80Z" fill="#faf9fd"/><text x="800" y="78" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#201d2d" text-anchor="middle">Diffusion, Osmosis, and Active Transport</text><text x="800" y="125" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#6f49c9" text-anchor="middle">Three ways substances move across cell membranes</text><rect x="55" y="180" width="460" height="560" rx="28" fill="#eee8ff" stroke="#6f49c9" stroke-width="5"/><text x="285" y="225" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#6f49c9" text-anchor="middle">Diffusion</text><text x="285" y="262" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#201d2d" text-anchor="middle">Particles move high → low concentration</text><rect x="100" y="315" width="160" height="190" rx="18" fill="#fff" stroke="#6f49c9" stroke-width="4"/><rect x="310" y="315" width="160" height="190" rx="18" fill="#fff" stroke="#6f49c9" stroke-width="4"/><text x="180" y="290" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#6f49c9" text-anchor="middle">HIGH</text><text x="390" y="290" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#6f49c9" text-anchor="middle">LOW</text><circle cx="140" cy="350" r="11" fill="#6f49c9" stroke="none" stroke-width="0"/><circle cx="188" cy="350" r="11" fill="#6f49c9" stroke="none" stroke-width="0"/><circle cx="140" cy="404" r="11" fill="#6f49c9" stroke="none" stroke-width="0"/