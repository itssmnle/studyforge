<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Enzyme Action</title><desc id="desc">Lock and key model showing a substrate binding to an enzyme active site.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><path d="M800 80 C650 250 950 250 800 820 C650 600 950 600 800 80Z" fill="#faf9fd"/><text x="800" y="78" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#201d2d" text-anchor="middle">Enzyme Action</text><text x="800" y="125" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#6f49c9" text-anchor="middle">Lock and key model of enzyme-substrate binding</text><rect x="120" y="220" width="540" height="450" rx="28" fill="#eee8ff" stroke="#6f49c9" stroke-width="5"/><rect x="940" y="220" width="540" height="450" rx="28" fill="#d8f3f0" stroke="#2ba6a5" stroke-width="5"/><text x="390" y="270" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#6f49c9" text-anchor="middle">Before binding</text><text x="1210" y="270" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#2ba6a5" text-anchor="middle">Enzyme-substrate complex</text><path d="M220 500 L220 390 Q220 350 260 350 L360 350 L360 410 L430 410 L430 470 L360 470 L360 530 L260 530 Q220 530 220 500Z" fill="#6f49c9"/><text x="330" y="600" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#201d2d" text-anchor="middle">Enzyme</text><path d="M525 400 l45 -30 45 30 -25 45 h-40z" fill="#e8ad00"/><text x="580" y="535" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#201d2d" text-anchor="middle">Substrate</text><line x1="670" y1="440" x2="900" y2="440" stroke="#6f49c9" stroke-width="7" /><path d="M882,428 L900,440 L882,452" fill="none" stroke="#6f49c9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1025 500 L1025 390 Q1025 350 1065 350 L1165 350 L1165 410 L1235 410 L1235 470 L1165 470 L1165 530 L1065 530 Q1025 530 1025 500Z" fill="#2ba6a5"/><path d="M1250 400 l45 -30 45 30 -25 45 h-40z" fill="#e8ad00"/><text x="1210" y="600" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#201d2d" text-anchor="middle">Complementary shapes fit together</text><text x="800" y="850" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#6f49c9" text-anchor="middle">The active site has a complementary shape to its substrate.</text></svg>